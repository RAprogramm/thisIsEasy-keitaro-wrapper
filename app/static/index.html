<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro wrapper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231c1f23'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='system-ui'%3EK%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
<header class="topbar">
  <div class="brand">
    <span class="logo">K</span>
    <div>
      <h1>Keitaro wrapper</h1>
      <p class="tagline">обёртка над Keitaro Admin API: создаватор кампаний и редактор потоков</p>
    </div>
  </div>
  <nav class="tabs">
    <button id="tab-create" class="active">Создать кампанию</button>
    <button id="tab-edit">Редактор кампании</button>
  </nav>
</header>

<section id="view-create" class="card">
  <form id="create-form">
    <div class="row">
      <div><label>Название (префикс добавится сам)</label><input id="c-name" required placeholder="campaign1"></div>
      <div><label>Гео (ISO-код)</label><input id="c-geo" required maxlength="2" placeholder="US"></div>
      <div><label>Оффер</label><select id="c-offer" required></select></div>
    </div>
    <div class="row">
      <div><label>Домен</label><select id="c-domain"></select></div>
      <div><label>Группа</label><select id="c-group"></select></div>
      <div><label>Источник</label><select id="c-source"></select></div>
    </div>
    <button class="btn primary" type="submit">Создать кампанию в Keitaro</button>
    <div id="c-msg"></div>
  </form>
</section>

<section id="view-edit" class="hidden">
  <div class="card">
    <div class="row">
      <div><label>ID кампании в Keitaro</label>
        <div class="combo">
          <input id="e-id" type="text" inputmode="numeric" spellcheck="false"
            placeholder="Название или ID — есть автоподбор"
            role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="combo-list-campaign">
          <ul class="combo-list" id="combo-list-campaign" role="listbox" hidden></ul>
        </div>
      </div>
      <div><label>Недавно созданные этой обёрткой</label><select id="e-recent"><option value="">—</option></select></div>
      <div><label>Статистика за период: с</label><input id="e-from" type="date"></div>
      <div><label>по</label><input id="e-to" type="date"></div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="e-load">Получить потоки из Keitaro</button>
      <button class="btn" id="e-open" disabled>Открыть в Keitaro ↗</button>
      <button class="btn" id="e-offers">Показать все офферы</button>
    </div>
    <div id="offers-panel" class="offers-panel hidden">
      <input id="offers-filter" placeholder="Фильтр: название или ID оффера">
      <div id="offers-list" class="offers-grid"></div>
    </div>
    <div id="e-msg"></div>
  </div>
  <div id="e-body"></div>
  <div id="e-status" class="statusbar hidden" role="status" aria-live="polite">
    <span class="dot"></span><span id="e-status-text"></span><span id="e-status-time" class="time"></span>
  </div>
</section>
<script type="module" src="/static/app.js"></script>
</body>
</html>
