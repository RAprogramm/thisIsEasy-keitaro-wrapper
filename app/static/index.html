<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keitaro wrapper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231c1f23'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='system-ui'%3EK%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --ink: #1c1f23; --muted: #6b7280; --line: #e3e6ea;
    --amber: #b45309; --amber-bg: #fff8e6; --amber-line: #f0b429;
    --green: #15803d; --red: #b91c1c; --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
  }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink);
    max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    flex-wrap: wrap; margin-bottom: 1.25rem; }
  .brand { display: flex; align-items: center; gap: .7rem; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
  .tagline { margin: 0; color: var(--muted); font-size: .85rem; }
  .tabs { display: flex; background: #e8eaee; padding: 4px; border-radius: 10px; gap: 4px; }
  .tabs button { border: 0; background: transparent; padding: .5rem 1rem; border-radius: 8px;
    cursor: pointer; font: inherit; font-weight: 500; color: #4b5563; transition: .15s; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .card.dirty { border-color: var(--amber-line); border-left: 4px solid var(--amber-line);
    background: var(--amber-bg); }
  .card-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; margin-bottom: .25rem; }
  .row > div { flex: 1 1 220px; min-width: 0; }
  label { display: block; font-size: .85rem; color: #555; margin-bottom: .3rem; }
  input, select { width: 100%; padding: .55rem .6rem; border: 1px solid #ccd1d8; border-radius: 8px;
    font: inherit; background: #fff; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid #2f6fed; outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid #ccd1d8; background: #fff; padding: .55rem 1rem; border-radius: 8px;
    font-weight: 500; transition: .15s; }
  .btn:hover { border-color: #aab1ba; background: #f6f7f9; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #000; }
  .btn.small { padding: .35rem .6rem; font-size: .8rem; }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.danger:hover { background: #9f1c1c; }
  .btn.restore { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.restore:hover { background: #116b32; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1rem; }
  .offers-panel { margin-top: 1rem; border-top: 1px dashed var(--line); padding-top: 1rem; }
  .offers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: .5rem; margin-top: .7rem; max-height: 260px; overflow-y: auto; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: .45rem .7rem;
    font-size: .85rem; background: #fff; }
  .table-wrap { overflow-x: auto; margin-top: .9rem; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { border-bottom: 1px solid #edeff2; padding: .5rem .45rem; text-align: left;
    font-size: .87rem; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase;
    letter-spacing: .03em; }
  tbody tr:nth-child(even) { background: #fafbfc; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  td:first-child { white-space: normal; min-width: 140px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .msg { padding: .6rem .8rem; border-radius: 8px; margin-top: .75rem; }
  .msg.ok { background: #e8f5e9; color: #1b5e20; }
  .msg.err { background: #fdecea; color: #b71c1c; }
  .hidden { display: none; }
  tr.removed { background: #f2f2f2; color: #999; }
  tr.removed td { text-decoration: line-through; }
  .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .5rem;
    border-radius: 999px; font-size: .75rem; font-weight: 500; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.pending { background: #fdf1d6; color: #8a5a06; }
  .badge.removed { background: #e9ecef; color: #495057; }
  .badge.sync { background: #dcfce7; color: #14532d; }
  .actions { display: flex; gap: .4rem; align-items: center; }
  .combo { position: relative; }
  .combo-list { position: absolute; z-index: 10; top: calc(100% + 2px); left: 0; right: 0;
    margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid #ccd1d8;
    border-radius: 8px; max-height: 240px; overflow-y: auto; box-shadow: 0 6px 16px rgba(16,24,40,.14); }
  .combo-list li { padding: .5rem .7rem; cursor: pointer; font-size: .9rem; }
  .combo-list li.active { background: #eef3ff; }
  .combo-list li mark { background: #ffe9a8; color: inherit; padding: 0; }
  .combo-list li.combo-empty { color: #888; cursor: default; }
  .add-offer { margin-top: 1.1rem; }
  .statusbar { position: sticky; bottom: .75rem; display: flex; align-items: center; gap: .55rem;
    background: #111827; color: #e5e7eb; padding: .6rem .95rem; border-radius: 10px;
    font-size: .85rem; box-shadow: 0 4px 14px rgba(16,24,40,.3); }
  .statusbar .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex: none; }
  .statusbar.warn .dot { background: #f59e0b; }
  .statusbar.err .dot { background: #ef4444; }
  .statusbar .time { margin-left: auto; color: #9ca3af; }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .tabs button { transition: .15s ease; }
  }
  @media (max-width: 720px) {
    body { padding: 1rem .75rem 2rem; }
    .card { padding: 1rem; }
    .row > div { flex-basis: 100%; }
    .toolbar .btn { width: 100%; }
    .actions .btn { padding: .5rem .9rem; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">K</span>
    <div>
      <h1>Keitaro wrapper</h1>
      <p class="tagline">обёртка над Keitaro Admin API: создаватор кампаний и редактор потоков</p>
    </div>
  </div>
  <nav class="tabs">
    <button id="tab-create" class="active">Создать кампанию</button>
    <button id="tab-edit">Редактор кампании</button>
  </nav>
</header>

<section id="view-create" class="card">
  <form id="create-form">
    <div class="row">
      <div><label>Название (префикс добавится сам)</label><input id="c-name" required placeholder="campaign1"></div>
      <div><label>Гео (ISO-код)</label><input id="c-geo" required maxlength="2" placeholder="US"></div>
      <div><label>Оффер</label><select id="c-offer" required></select></div>
    </div>
    <div class="row">
      <div><label>Домен</label><select id="c-domain"></select></div>
      <div><label>Группа</label><select id="c-group"></select></div>
      <div><label>Источник</label><select id="c-source"></select></div>
    </div>
    <button class="btn primary" type="submit">Создать кампанию в Keitaro</button>
    <div id="c-msg"></div>
  </form>
</section>

<section id="view-edit" class="hidden">
  <div class="card">
    <div class="row">
      <div><label>ID кампании в Keitaro</label>
        <div class="combo">
          <input id="e-id" type="text" inputmode="numeric" spellcheck="false"
            placeholder="Название или ID — есть автоподбор"
            role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="combo-list-campaign">
          <ul class="combo-list" id="combo-list-campaign" role="listbox" hidden></ul>
        </div>
      </div>
      <div><label>Недавно созданные этой обёрткой</label><select id="e-recent"><option value="">—</option></select></div>
      <div><label>Статистика за период: с</label><input id="e-from" type="date"></div>
      <div><label>по</label><input id="e-to" type="date"></div>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="e-load">Получить потоки из Keitaro</button>
      <button class="btn" id="e-open" disabled>Открыть в Keitaro ↗</button>
      <button class="btn" id="e-offers">Показать все офферы</button>
    </div>
    <div id="offers-panel" class="offers-panel hidden">
      <input id="offers-filter" placeholder="Фильтр: название или ID оффера">
      <div id="offers-list" class="offers-grid"></div>
    </div>
    <div id="e-msg"></div>
  </div>
  <div id="e-body"></div>
  <div id="e-status" class="statusbar hidden">
    <span class="dot"></span><span id="e-status-text"></span><span id="e-status-time" class="time"></span>
  </div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let dict = { offers: [] };
let currentCampaign = null;

function esc(v) { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
function errorMessage(data) {
  const d = data && data.detail;
  if (Array.isArray(d)) return d.map(e => (e.loc || []).slice(1).join('.') + ': ' + e.msg).join('; ');
  if (typeof d === 'string') return d;
  return JSON.stringify(data);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { detail: text }; }
  if (!r.ok) throw new Error(errorMessage(data));
  return data;
}
function show(el, text, ok) { el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}"></div>`; el.firstChild.textContent = text; }

function setStatus(text, kind) {
  const bar = $('e-status');
  bar.classList.remove('hidden', 'warn', 'err');
  if (kind) bar.classList.add(kind);
  $('e-status-text').textContent = text;
  $('e-status-time').textContent = new Date().toLocaleTimeString('ru-RU');
}

function syncStatus() {
  const c = currentCampaign;
  const withOffers = c.streams.filter(s => s.schema === 'landings').length;
  const dirty = c.streams.filter(s => s.dirty).length;
  if (dirty) {
    setStatus(`Потоков: ${c.streams.length}, с офферами: ${withOffers}. Не отправлено в Keitaro: ${dirty} — нажмите «Отправить изменения в Keitarо»`, 'warn');
  } else {
    setStatus(`Потоков: ${c.streams.length}, с офферами: ${withOffers}. Всё синхронизировано с Keitaro`, 'ok');
  }
}

function fill(sel, items, withEmpty) {
  sel.innerHTML = '';
  if (withEmpty) sel.append(new Option('— по умолчанию —', ''));
  for (const it of items) sel.append(new Option(it.name, it.id));
}

async function init() {
  try { dict = await api('/api/dictionaries'); } catch (e) { show($('c-msg'), e.message, false); return; }
  fill($('c-offer'), dict.offers, false);
  fill($('c-domain'), dict.domains, true);
  fill($('c-group'), dict.groups, true);
  fill($('c-source'), dict.sources, true);
  loadRecent();
}

async function loadRecent() {
  try {
    const rows = await api('/api/campaigns');
    const sel = $('e-recent');
    sel.innerHTML = '<option value="">—</option>';
    for (const r of rows) sel.append(new Option(`${r.name} (#${r.id})`, r.id));
  } catch (e) { /* ignore */ }
}

async function loadCampaign(id) {
  if (!id) return show($('e-msg'), 'Введите ID кампании', false);
  const btn = $('e-load');
  btn.disabled = true;
  setStatus('Получаю потоки из Keitaro…');
  try {
    const params = new URLSearchParams();
    const from = $('e-from').value, to = $('e-to').value;
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    const qs = params.toString() ? '?' + params.toString() : '';
    currentCampaign = await api('/api/campaigns/' + id + qs);
    $('e-msg').innerHTML = '';
    $('e-open').disabled = false;
    render();
    syncStatus();
  } catch (e) {
    $('e-body').innerHTML = '';
    show($('e-msg'), e.message, false);
    setStatus(`Не удалось получить потоки: ${e.message}`, 'err');
  } finally { btn.disabled = false; }
}

const fmt = (n) => (Number(n) || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });

function render() {
  const c = currentCampaign;
  let html = `<h2>${esc(c.name)} <span class="muted">#${c.id}</span></h2>`;
  if (c.stats_error) html += `<div class="msg err">Статистика не загрузилась, цифры ниже недостоверны: ${esc(c.stats_error)}</div>`;
  for (const s of c.streams) {
    const isOffers = s.schema === 'landings';
    const dirtyCls = s.dirty ? 'dirty' : '';
    html += `<div class="card ${dirtyCls}"><div class="card-head"><strong>${esc(s.name || 'Поток')}</strong>`;
    html += `<span class="muted">${isOffers ? 'поток с офферами' : 'поток-редирект — без офферов'}</span>`;
    if (s.dirty) html += `<span class="badge pending">не отправлено в Keitaro</span>`;
    else if (isOffers) html += `<span class="badge sync">синхронизирован</span>`;
    html += `</div>`;
    if (!isOffers) { html += `<p class="muted">Этот поток настроен напрямую в Keitaro, обёртка его не меняет.</p></div>`; continue; }
    html += `<div class="table-wrap"><table><thead><tr><th>Оффер</th><th class="num">Доля, %</th><th>Статус</th><th>Закрепить долю</th><th class="num">Клики</th><th class="num">Уники</th><th class="num">Конверсии</th><th class="num">Доход</th><th class="num">Расход</th><th class="num">Профит</th><th></th></tr></thead><tbody>`;
    for (const o of s.offers) {
      const st = o.stats || {};
      const removed = o.status === 'removed';
      const staged = removed || o.status === 'pending_remove';
      const rowCls = staged ? 'removed' : '';
      const statusBadge = o.status === 'pending_add' ? '<span class="badge pending">не отправлен</span>'
        : o.status === 'pending_remove' ? '<span class="badge pending">к удалению</span>'
        : o.status === 'removed' ? '<span class="badge removed">в архиве</span>' : '';
      html += `<tr class="${rowCls}">
        <td>${esc(o.name)} <span class="muted">#${o.offer_id}</span></td>
        <td class="num">${o.share}</td>
        <td>${statusBadge}</td>
        <td><input type="checkbox" data-pin="${o.offer_id}" data-stream="${s.id}" title="Закрепить долю — не участвовать в пересчёте" ${o.pinned ? 'checked' : ''} ${staged ? 'disabled' : ''}></td>
        <td class="num">${fmt(st.clicks)}</td><td class="num">${fmt(st.unique_clicks)}</td><td class="num">${fmt(st.conversions)}</td>
        <td class="num">${fmt(st.revenue)}</td><td class="num">${fmt(st.cost)}</td><td class="num">${fmt(st.profit)}</td>
        <td class="actions">
          ${removed
            ? `<button class="btn restore small" data-restore="${o.offer_id}" data-stream="${s.id}">Вернуть в поток</button>`
            : staged ? '' : `<button class="btn danger small" data-del="${o.offer_id}" data-stream="${s.id}">Убрать из потока</button>`}
        </td></tr>`;
    }
    html += `</tbody></table></div>
      <div class="row add-offer">
        <div><label>Добавить оффер в поток</label>
          <div class="combo">
            <input type="text" class="combo-input" data-combo="${s.id}" autocomplete="off" spellcheck="false"
              role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="combo-list-${s.id}"
              placeholder="Начните вводить название или ID оффера">
            <ul class="combo-list" id="combo-list-${s.id}" role="listbox" hidden></ul>
          </div>
        </div>
        <div><button class="btn primary" data-add="${s.id}">Добавить в поток</button></div>
      </div>`;
    if (s.dirty) {
      html += `<div class="row add-offer">
        <button class="btn primary" data-push="${s.id}">Отправить изменения в Keitaro</button>
        <button class="btn" data-cancel="${s.id}">Отменить изменения</button>
      </div>`;
    }
    html += `</div>`;
  }
  $('e-body').innerHTML = html;

  $('e-body').querySelectorAll('[data-del]').forEach(b => b.onclick = () => changeOffer('DELETE', b, b.dataset.del, b.dataset.stream));
  $('e-body').querySelectorAll('[data-add]').forEach(b => b.onclick = () => addFromCombo(b.dataset.add));
  $('e-body').querySelectorAll('[data-combo]').forEach(inp => makeCombo(
    inp,
    offerFetcher(inp.dataset.combo),
    (it) => { inp.value = `${it.name} (#${it.id})`; inp.dataset.selectedId = it.id; },
  ));
  $('e-body').querySelectorAll('[data-restore]').forEach(b => b.onclick = () => restoreOffer(b, b.dataset.restore, b.dataset.stream));
  $('e-body').querySelectorAll('[data-push]').forEach(b => b.onclick = () => pushStream(b, b.dataset.push));
  $('e-body').querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelStream(b, b.dataset.cancel));
  $('e-body').querySelectorAll('[data-pin]').forEach(cb => cb.onchange = () => pinOffer(cb, cb.dataset.pin, cb.dataset.stream, cb.checked));
}

async function changeOffer(method, btn, offerId, streamId) {
  if (!offerId) return;
  if (method === 'DELETE' && !confirm('Убрать оффер из потока? Он останется в архиве обёртки, пока вы не отмените изменение.')) return;
  btn.disabled = true;
  const id = currentCampaign.id;
  try {
    currentCampaign = method === 'POST'
      ? await api(`/api/campaigns/${id}/offers`, { method, body: JSON.stringify({ offer_id: Number(offerId), stream_id: Number(streamId) }) })
      : await api(`/api/campaigns/${id}/offers/${offerId}?stream_id=${streamId}`, { method });
    $('e-msg').innerHTML = '';
    render();
    setStatus(method === 'POST'
      ? `Оффер #${offerId} добавлен в поток, доли пересчитаны. Изменения ещё не отправлены в Keitaro`
      : `Оффер #${offerId} убран из потока (доля 0%). Изменения ещё не отправлены в Keitaro`, 'warn');
  } catch (e) { show($('e-msg'), e.message, false); setStatus(e.message, 'err'); btn.disabled = false; }
}

async function restoreOffer(btn, offerId, streamId) {
  btn.disabled = true;
  const id = currentCampaign.id;
  try {
    currentCampaign = await api(`/api/campaigns/${id}/offers/${offerId}/restore?stream_id=${streamId}`, { method: 'POST' });
    $('e-msg').innerHTML = '';
    render();
    setStatus(`Оффер #${offerId} возвращён в поток. Отправьте изменения в Keitaro, чтобы закрепить`, 'warn');
  } catch (e) { show($('e-msg'), e.message, false); setStatus(e.message, 'err'); btn.disabled = false; }
}

async function pushStream(btn, streamId) {
  btn.disabled = true;
  const id = currentCampaign.id;
  setStatus('Отправляю изменения в Keitaro…');
  try {
    currentCampaign = await api(`/api/campaigns/${id}/push?stream_id=${streamId}`, { method: 'POST' });
    $('e-msg').innerHTML = '';
    render();
    setStatus('Изменения отправлены в Keitaro', 'ok');
  } catch (e) { show($('e-msg'), e.message, false); setStatus(`Не удалось отправить: ${e.message}`, 'err'); btn.disabled = false; }
}

async function cancelStream(btn, streamId) {
  if (!confirm('Отменить все не отправленные изменения в этом потоке?')) return;
  btn.disabled = true;
  const id = currentCampaign.id;
  try {
    currentCampaign = await api(`/api/campaigns/${id}/cancel?stream_id=${streamId}`, { method: 'POST' });
    $('e-msg').innerHTML = '';
    render();
    setStatus('Изменения отменены, поток снова синхронизирован с Keitaro', 'ok');
  } catch (e) { show($('e-msg'), e.message, false); setStatus(e.message, 'err'); btn.disabled = false; }
}

async function pinOffer(cb, offerId, streamId, pinned) {
  const id = currentCampaign.id;
  try {
    currentCampaign = await api(`/api/campaigns/${id}/offers/${offerId}/pin?stream_id=${streamId}&pinned=${pinned}`, { method: 'POST' });
    $('e-msg').innerHTML = '';
    render();
    setStatus(pinned
      ? `Доля оффера #${offerId} закреплена — пересчёты её не тронут`
      : `Доля оффера #${offerId} больше не закреплена`, 'warn');
  } catch (e) { show($('e-msg'), e.message, false); setStatus(e.message, 'err'); cb.checked = !pinned; }
}

const COMBO_DEBOUNCE_MS = 150;
const COMBO_LIMIT = 20;

function comboStream(streamId) {
  return currentCampaign.streams.find(s => String(s.id) === String(streamId));
}

function appendHighlighted(li, name, needle) {
  const idx = needle ? name.toLowerCase().indexOf(needle) : -1;
  if (idx < 0) { li.append(document.createTextNode(name)); return; }
  li.append(document.createTextNode(name.slice(0, idx)));
  const mark = document.createElement('mark');
  mark.textContent = name.slice(idx, idx + needle.length);
  li.append(mark, document.createTextNode(name.slice(idx + needle.length)));
}

function closeCombo(ui) {
  ui.list.hidden = true;
  ui.input.setAttribute('aria-expanded', 'false');
  ui.input.removeAttribute('aria-activedescendant');
  ui.active = -1;
}

function renderComboOptions(ui, items) {
  ui.items = items;
  ui.list.innerHTML = '';
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'combo-empty';
    li.setAttribute('role', 'option');
    li.setAttribute('aria-disabled', 'true');
    li.textContent = 'Ничего не найдено';
    ui.list.append(li);
  }
  const needle = ui.query.trim().toLowerCase();
  for (const it of items) {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.id = `${ui.list.id}-opt-${it.id}`;
    li.dataset.offerId = it.id;
    appendHighlighted(li, it.name, needle);
    const idSpan = document.createElement('span');
    idSpan.className = 'muted';
    idSpan.textContent = ` #${it.id}`;
    li.append(idSpan);
    li.onmousedown = (e) => { e.preventDefault(); selectComboOption(ui, it); };
    ui.list.append(li);
  }
  ui.list.hidden = false;
  ui.input.setAttribute('aria-expanded', 'true');
  ui.active = -1;
}

async function refreshCombo(ui) {
  const query = ui.query;
  let rows;
  try {
    rows = await ui.fetchItems(query);
  } catch (e) { return; }
  if (ui.query !== query) return;
  renderComboOptions(ui, rows);
}

function selectComboOption(ui, it) {
  ui.onSelect(it);
  closeCombo(ui);
}

function moveComboActive(ui, delta) {
  const opts = [...ui.list.querySelectorAll('li[data-offer-id]')];
  if (!opts.length) return;
  ui.active = (ui.active + delta + opts.length) % opts.length;
  opts.forEach((li, i) => li.classList.toggle('active', i === ui.active));
  ui.input.setAttribute('aria-activedescendant', opts[ui.active].id);
  opts[ui.active].scrollIntoView({ block: 'nearest' });
}

function makeCombo(input, fetchItems, onSelect) {
  const ui = {
    input,
    list: $(input.getAttribute('aria-controls')),
    query: '',
    items: [],
    active: -1,
    timer: 0,
    fetchItems,
    onSelect,
  };
  input.onfocus = () => { ui.query = ''; refreshCombo(ui); };
  input.oninput = () => {
    ui.query = input.value;
    input.dataset.selectedId = '';
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => refreshCombo(ui), COMBO_DEBOUNCE_MS);
  };
  input.onkeydown = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (ui.list.hidden) refreshCombo(ui);
      else moveComboActive(ui, e.key === 'ArrowDown' ? 1 : -1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!ui.list.hidden && ui.active >= 0) selectComboOption(ui, ui.items[ui.active]);
    } else if (e.key === 'Escape' || e.key === 'Tab') {
      closeCombo(ui);
    }
  };
  input.onblur = () => closeCombo(ui);
}

function offerFetcher(streamId) {
  return async (query) => {
    const rows = await api(`/api/offers/search?q=${encodeURIComponent(query)}&limit=${COMBO_LIMIT}`);
    const used = new Set((comboStream(streamId)?.offers ?? []).filter(o => o.status !== 'removed').map(o => o.offer_id));
    return rows.filter(o => !used.has(o.id));
  };
}

function addFromCombo(streamId) {
  const input = $('e-body').querySelector(`[data-combo="${streamId}"]`);
  const typed = input.value.trim();
  const offerId = input.dataset.selectedId || (/^\d+$/.test(typed) ? typed : '');
  if (!offerId) { show($('e-msg'), 'Выберите оффер из списка или введите его ID', false); return; }
  changeOffer('POST', input, offerId, streamId);
}

function renderOffers(filter) {
  const needle = filter.trim().toLowerCase();
  const items = dict.offers.filter(o => !needle || o.name.toLowerCase().includes(needle) || String(o.id) === needle);
  $('offers-list').innerHTML = items.length
    ? items.map(o => `<div class="chip">${esc(o.name)} <span class="muted">#${o.id}</span></div>`).join('')
    : '<span class="muted">Ничего не найдено</span>';
}

$('tab-create').onclick = () => switchTab('create');
$('tab-edit').onclick = () => switchTab('edit');
function switchTab(name) {
  $('view-create').classList.toggle('hidden', name !== 'create');
  $('view-edit').classList.toggle('hidden', name !== 'edit');
  $('tab-create').classList.toggle('active', name === 'create');
  $('tab-edit').classList.toggle('active', name === 'edit');
}

$('create-form').onsubmit = async (e) => {
  e.preventDefault();
  const body = {
    name: $('c-name').value.trim(),
    geo: $('c-geo').value.trim(),
    offer_id: Number($('c-offer').value),
    domain_id: $('c-domain').value ? Number($('c-domain').value) : null,
    group_id: $('c-group').value ? Number($('c-group').value) : null,
    source_id: $('c-source').value ? Number($('c-source').value) : null,
  };
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    const r = await api('/api/campaigns', { method: 'POST', body: JSON.stringify(body) });
    show($('c-msg'), `Создана кампания #${r.id} «${r.name}» — откройте её в редакторе`, true);
    $('e-id').value = r.id;
    loadRecent();
  } catch (e2) { show($('c-msg'), e2.message, false); } finally { btn.disabled = false; }
};

$('e-load').onclick = () => {
  const el = $('e-id');
  const id = el.dataset.selectedId || (/^\d+$/.test(el.value.trim()) ? el.value.trim() : '');
  if (!id) return show($('e-msg'), 'Введите ID кампании или выберите её из списка', false);
  loadCampaign(id);
};
makeCombo(
  $('e-id'),
  (query) => api(`/api/campaigns/search?q=${encodeURIComponent(query)}&limit=${COMBO_LIMIT}`),
  (it) => {
    $('e-id').value = `${it.name} (#${it.id})`;
    $('e-id').dataset.selectedId = String(it.id);
    loadCampaign(String(it.id));
  },
);
$('e-open').onclick = () => {
  if (currentCampaign) window.open(`${currentCampaign.keitaro_url}/admin/#!/campaigns/`, '_blank');
};
$('e-offers').onclick = () => {
  const panel = $('offers-panel');
  panel.classList.toggle('hidden');
  $('e-offers').textContent = panel.classList.contains('hidden') ? 'Показать все офферы' : 'Скрыть все офферы';
  if (!panel.classList.contains('hidden')) { renderOffers($('offers-filter').value); $('offers-filter').focus(); }
};
$('offers-filter').oninput = (e) => renderOffers(e.target.value);
$('e-from').onchange = () => { if ($('e-id').value) $('e-load').click(); };
$('e-to').onchange = () => { if ($('e-id').value) $('e-load').click(); };
$('e-recent').onchange = (e) => {
  if (e.target.value) {
    $('e-id').value = e.target.value;
    $('e-id').dataset.selectedId = e.target.value;
    loadCampaign(e.target.value);
  }
};

init();
</script>
</body>
</html>
