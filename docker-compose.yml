---
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keitaro
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/keitaro
      KEITARO_API_KEY: ${KEITARO_API_KEY}
      KEITARO_URL: ${KEITARO_URL:-https://tlgk.host}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
