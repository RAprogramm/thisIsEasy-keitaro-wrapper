[project]
name = "keitaro-wrapper"
version = "1.0.0"
description = "FastAPI + SQLAlchemy wrapper around the Keitaro Admin API: campaign creator and offer editor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-socket",
    "respx",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "FAST", "RUF", "C4", "PERF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/__main__.py" = ["S104"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
strict = true
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# sysmon is the coverage core used by Python 3.14+ by default. On 3.13 the default
# settrace cores lose statements after a suspended coroutine resumes
# (coveragepy/coveragepy#2245), which under-reports async handlers. Drop this line
# once the upstream fix is released and the pinned coverage includes it.
core = "sysmon"
omit = ["app/__main__.py"]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.mypy]
strict = true
python_version = "3.13"
