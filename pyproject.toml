[project]
name = "keitaro-wrapper"
version = "1.0.0"
description = "FastAPI + SQLAlchemy wrapper around the Keitaro Admin API: campaign creator and offer editor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "starlette",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "psycopg[binary]",
    "httpx2",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-httpx2",
    "pytest-socket",
    "respx",
    "ruff",
    "mypy",
    "yamllint",
    "pip-audit",
    "deptry>=0.25.1",
    "typos>=1.52.2",
]

[tool.uv]
package = false

[tool.deptry]
# psycopg is loaded by SQLAlchemy through the `postgresql+psycopg://` scheme and
# python-dotenv by pydantic-settings when reading .env: both are runtime-only.
# `app` is the first-party package of this repository.
[tool.deptry.per_rule_ignores]
DEP001 = ["app"]
DEP002 = ["psycopg", "python-dotenv"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "FAST", "RUF", "C4", "PERF", "DTZ"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"app/__main__.py" = ["S104"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
strict = true
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.coverage.run]
# Pin the modern core: sysmon is the default on Python 3.14+ and pinning it keeps
# measurement identical on every interpreter. The legacy settrace cores under-report
# statements that run after a suspended coroutine resumes (coveragepy/coveragepy#2245).
core = "sysmon"
omit = ["app/__main__.py"]

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.mypy]
strict = true
python_version = "3.14"
